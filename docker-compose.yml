version: "3.8"

services:
  ivs:
    build: .
    container_name: mtn-ivs
    ports:
      - "3011:3011"
    environment:
      - PORT=3011
      - NODE_ENV=production
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - JWT_SECRET=${JWT_SECRET:-change-this-jwt-secret-in-production}
      - API_KEYS=${API_KEYS:-cvg-api-key-change-me}
      - HMAC_KEY=${HMAC_KEY:-Y2hhbmdlLXRoaXMtaG1hYy1rZXktaW4tcHJvZHVjdGlvbi1taW5pbXVtLTI1Ni1iaXQ=}
      - HMAC_KEY_VERSION=v1
      - SIGNING_KEY=${SIGNING_KEY:-Y2hhbmdlLXRoaXMtc2lnbmluZy1rZXktaW4tcHJvZHVjdGlvbg==}
      - SIGNING_KEY_VERSION=v1
      - NIU_API_URL=https://api.egovwallet.com/api/kyc/verify
      - NIU_API_TIMEOUT=30000
      - IVS_INSTANCE_ID=IVS-MTN-01
      - TRUSTED_GATEWAYS=CVG-CTI-01
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
